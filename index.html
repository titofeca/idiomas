<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LinguaQuest" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="Aprende Inglés Avanzado y Chino Mandarín HSK 3.0 con compañeros manga flotantes, voz por micrófono y retos diarios." />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>LinguaQuest - Inglés y Chino por Voz con Compañeros Manga</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Google Fonts for crisp Latin & Chinese typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-gradient-to-b from-sky-50 via-white to-amber-50/50 text-slate-800 select-none antialiased overflow-x-hidden font-sans min-h-screen">
    <div id="root">
      <!-- Instant Loading Splash (Never Blank Screen) -->
      <div id="lq-splash" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center;">
        <div style="font-size:52px;animation:pulse 1.5s infinite;margin-bottom:16px;">🚀</div>
        <h1 style="font-size:22px;font-weight:900;color:#1e293b;margin:0 0 8px 0;letter-spacing:-0.5px;">LinguaQuest</h1>
        <p style="font-size:14px;color:#64748b;font-weight:600;margin:0 0 20px 0;">Cargando compañeros manga y retos familiares...</p>
        <div style="width:160px;height:4px;background:#e2e8f0;border-radius:999px;overflow:hidden;position:relative;">
          <div style="width:60%;height:100%;background:#4f46e5;border-radius:999px;position:absolute;animation:loadingBar 1.2s infinite ease-in-out;"></div>
        </div>

        <noscript>
          <div style="margin-top:24px;color:#b91c1c;font-size:13px;font-weight:bold;">
            Esta aplicación requiere JavaScript habilitado para funcionar.
          </div>
        </noscript>

        <!-- Emergency Auto-Recovery Button if cache was stale or React took too long -->
        <div id="lq-recovery-btn" style="display:none;margin-top:28px;max-width:320px;padding:16px;background:#fff;border-radius:20px;border:1px solid #e2e8f0;box-shadow:0 10px 20px rgba(0,0,0,0.06);">
          <div style="font-size:12px;color:#64748b;margin-bottom:10px;line-height:1.4;">
            ¿Tarda en cargar o pantalla parada? Puede haber una versión antigua en caché.
          </div>
          <button onclick="window.cleanLinguaQuestCache()" style="background:#4f46e5;color:#fff;border:none;padding:10px 18px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;width:100%;">
            🔄 Limpiar Caché y Entrar
          </button>
        </div>
      </div>
    </div>

    <style>
      @keyframes loadingBar {
        0% { left: -60%; width: 60%; }
        50% { left: 40%; width: 50%; }
        100% { left: 100%; width: 60%; }
      }
    </style>

    <script>
      // Self-healing recovery helper
      window.cleanLinguaQuestCache = function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var r of regs) { r.unregister(); }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            return Promise.all(keys.map(function(k) { return caches.delete(k); }));
          }).then(function() {
            window.location.reload(true);
          });
        } else {
          window.location.reload(true);
        }
      };

      // Show recovery button if React hasn't mounted in 3.5 seconds
      setTimeout(function() {
        var rec = document.getElementById('lq-recovery-btn');
        if (rec) rec.style.display = 'block';
      }, 3500);

      // Register or update Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            // Check for updates immediately
            reg.update();
          }).catch(function(err) {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
