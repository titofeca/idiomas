<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield Background -->
  <rect width="512" height="512" rx="110" fill="#0f172a" />
  
  <circle cx="256" cy="256" r="210" fill="url(#grad)" opacity="0.18" filter="url(#glow)"/>
  
  <!-- Crest Shape -->
  <path d="M 256 60 L 400 120 C 400 300 256 420 256 450 C 256 420 112 300 112 120 Z" 
        fill="url(#grad)" 
        stroke="#38bdf8" 
        stroke-width="8" />

  <!-- Inner Dragon / Letter L & Q Monogram & Lightning -->
  <!-- Lightning Bolt for Dopamine/Energy -->
  <path d="M 270 120 L 210 240 L 260 240 L 230 380 L 315 230 L 265 230 Z" 
        fill="url(#goldGrad)" 
        stroke="#ffffff" 
        stroke-width="4" 
        stroke-linejoin="round"/>

  <!-- Character 文 (Language / Culture) in the background with subtle glow -->
  <text x="256" y="270" font-family="'Noto Sans SC', sans-serif" font-size="110" font-weight="900" fill="#ffffff" opacity="0.15" text-anchor="middle" dominant-baseline="central">文</text>
  
  <!-- Star Gems on top corners -->
  <polygon points="170,120 176,135 192,135 179,145 184,160 170,150 156,160 161,145 148,135 164,135" fill="#facc15" />
  <polygon points="342,120 348,135 364,135 351,145 356,160 342,150 328,160 333,145 320,135 336,135" fill="#facc15" />
</svg>
